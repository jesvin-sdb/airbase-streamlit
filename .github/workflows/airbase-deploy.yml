name: Deploy app on Airbase
on: push
jobs:
  Airbase-Deploy:
    runs-on: ubuntu-24.04
    if: github.ref_name == github.event.repository.default_branch
    env:
      AIRBASE_ACCESS_KEY_ID: ${{ secrets.AIRBASE_ACCESS_KEY_ID }}
      AIRBASE_SECRET_ACCESS_KEY: ${{ secrets.AIRBASE_SECRET_ACCESS_KEY }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install Airbase CLI
        shell: bash
        run: |
          mkdir -p $HOME/.local/bin
          curl -fsSL https://console.airbase.tech.gov.sg/dist/install.sh -o install.sh
          sh install.sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Verify CLI installed
        run: airbase --version
      - name: Airbase Deploy
        shell: bash
        run: |
          echo "${{ secrets.AIRBASE_ENV_LOCAL_FILE }}" > .env.local
          airbase deploy --yes
          echo "Deploy finished — check the log above for your app URL." >> $GITHUB_STEP_SUMMARY
