name: Fetch Airbase CLI
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download CLI from Airbase
        run: |
          curl -fsSL --retry 10 --retry-delay 10 --retry-all-errors \
            https://console.airbase.tech.gov.sg/dist/v1.1.1/airbase-linux-amd64 \
            -o airbase-linux-amd64
          chmod +x airbase-linux-amd64
      - name: Store it as a release on this repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create cli-v1.1.1 airbase-linux-amd64 \
            --title "Airbase CLI v1.1.1" --notes "CLI binary for CI use" \
            || gh release upload cli-v1.1.1 airbase-linux-amd64 --clobber
