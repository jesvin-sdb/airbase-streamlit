  <style>/* ============================================================
   COACHLY — "In Your Corner"  (bold reinvention)
   Editorial + warm · MEX DLS tokens · sidebar shell
   Tokens here also bridge the shared primitives (shared.jsx,
   charts.jsx) so they render correctly in this skin.
   ============================================================ */

:root {
  /* ---- Brand (MEX Hub Blue) ---- */
  --violet: #0063D0;          /* hero (name kept for shared.jsx) */
  --violet-ink: #002E84;
  --cyan: #2C8DFF;
  --brand-gradient: linear-gradient(120deg, #2C8DFF 0%, #0063D0 54%, #002E84 120%);
  --brand-soft: #EAF2FC;       /* Hub Blue 50 */

  /* ---- Warmth accent (Amber Orange) — the "human" note ---- */
  --amber: #FA7A25;            /* Amber Orange 700 */
  --amber-deep: #ED6105;       /* Amber Orange 900 */
  --amber-soft: #FFF1E3;       /* Amber Orange 50/100 */
  --gold: #F2A100;             /* star / rating gold */

  /* ---- Rise (women's mentorship) — its own rose/blush space ---- */
  --rise: #C4456E;
  --rise-deep: #9E2F54;
  --rise-soft: #FBEDF1;
  --rise-blush: #FCF4F0;       /* warm blush canvas for Rise */
  --rise-gradient: linear-gradient(125deg, #EC8AAA 0%, #D45B81 52%, #C4456E 120%);

  /* ---- Editorial surfaces (warm paper + white cards) ---- */
  --canvas: #F3EEE6;           /* warm paper — the app canvas */
  --canvas-2: #EFE9DF;
  --surface: #FFFFFF;
  --surface-inset: #EAF2FC;    /* (shared.jsx) tinted inset */
  --sidebar: #FFFFFF;
  --paper-line: #E6DFD2;       /* warm hairline on canvas */

  /* ---- Ink (navy + iron grey) ---- */
  --ink: #00103C;              /* Hub Blue 900 navy — headings */
  --ink-2: #3F4A5C;            /* body */
  --ink-3: #6B7280;            /* helper */
  --ink-4: #A7AEB8;            /* tertiary */
  --line: #E8E4DB;             /* card hairline (warm) */
  --line-2: #D9D3C7;           /* input border (warm) */

  /* ---- Status ---- */
  --green: #1F8517;
  --green-soft: #E4F9D3;
  --red: #C2261B;
  --blue: #0063D0;

  /* ---- Radii (MEX pill-default, soft cards) ---- */
  --r-card: 20px;
  --r-lg: 18px;
  --r-md: 13px;
  --r-sm: 9px;
  --r-pill: 999px;

  /* ---- Shadows (MEX elevation, pure black low-opacity) ---- */
  --shadow-sm: 0 2px 10px rgba(20, 14, 0, 0.05);
  --shadow-md: 0 6px 22px rgba(20, 14, 0, 0.07);
  --shadow-lg: 0 18px 44px rgba(10, 10, 30, 0.12);
  --shadow-rise: 0 16px 40px rgba(196, 69, 110, 0.24);

  /* ---- Type (MEX → Poppins) ---- */
  --font-display: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;

  /* runtime knobs (tweaks) */
  --accent: var(--amber);
  --accent-soft: var(--amber-soft);
  --sidebar-w: 264px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: -0.025em;
  margin: 0;
  color: var(--ink);
  text-wrap: balance;
  line-height: 1.08;
}
p { text-wrap: pretty; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, textarea, select { font-family: inherit; }
::selection { background: rgba(0, 99, 208, 0.16); }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-thumb:hover { background: var(--ink-4); background-clip: content-box; }

/* ===================== ATOMS ===================== */
.eyebrow {
  font-size: 12px; font-weight: 700; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--ink-3);
  display: inline-flex; align-items: center; gap: 9px;
}
.eyebrow .tick { width: 18px; height: 2px; border-radius: 2px; background: var(--accent); }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: var(--r-pill);
  font-size: 12.5px; font-weight: 600; white-space: nowrap;
  background: var(--brand-soft); color: var(--ink-2);
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: var(--r-pill); padding: 12px 22px;
  font-size: 14.5px; font-weight: 600; white-space: nowrap;
  transition: transform .14s ease, box-shadow .18s ease, background .18s, color .18s, border-color .18s;
}
.btn:active { transform: translateY(1px) scale(.99); }
.btn-primary { background: var(--brand-gradient); color: #fff; box-shadow: 0 8px 20px rgba(0,99,208,.26); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(0,99,208,.34); }
.btn-ghost { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line-2); }
.btn-ghost:hover { border-color: var(--violet); color: var(--violet); }
.btn-amber { background: linear-gradient(120deg,#FFB867,#FA7A25); color:#fff; box-shadow:0 8px 20px rgba(250,122,37,.30); }
.btn-amber:hover { transform: translateY(-1px); box-shadow:0 12px 28px rgba(250,122,37,.4); }
.btn-rise { background: var(--rise-gradient); color:#fff; box-shadow: var(--shadow-rise); }
.btn-rise:hover { transform: translateY(-1px); box-shadow: 0 20px 48px rgba(196,69,110,.34); }
.btn-sm { padding: 9px 16px; font-size: 13.5px; }
.btn-block { width: 100%; }

.card { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-sm); border: 1px solid var(--line); }

.avatar {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%; color: #fff; font-family: var(--font-display);
  font-weight: 700; flex-shrink: 0; user-select: none;
}

.field {
  width: 100%; border: 1.5px solid var(--line-2); background: var(--surface);
  border-radius: var(--r-md); padding: 12px 15px; font-size: 14.5px; color: var(--ink);
  transition: border-color .16s, box-shadow .16s;
}
.field::placeholder { color: var(--ink-4); }
.field:focus { outline: none; border-color: var(--violet); box-shadow: 0 0 0 4px rgba(0,99,208,.13); }

/* status pills */
.pill { display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:var(--r-pill); font-size:11.5px; font-weight:700; }
.pill .dot { width:7px; height:7px; border-radius:50%; }
.pill-confirmed { background: var(--green-soft); color:#136E10; }
.pill-confirmed .dot { background: var(--green); }
.pill-upcoming { background: var(--brand-soft); color:#063690; }
.pill-upcoming .dot { background: var(--blue); }
.pill-rise { background: var(--rise-soft); color: var(--rise-deep); }
.pill-rise .dot { background: var(--rise); }

/* corner-bracket motif */
.corner-mark { display:inline-block; width:26px; height:26px; flex-shrink:0; }

@keyframes fadeUp { from { opacity:0; transform: translateY(12px);} to {opacity:1; transform:none;} }
@keyframes riseIn { from { transform: translateY(12px);} to { transform:none;} }
@keyframes fadeIn { from { opacity:0;} to {opacity:1;} }
@keyframes scaleIn { from { opacity:0; transform: scale(.97);} to {opacity:1; transform:none;} }
@keyframes panelIn { from { transform: translateX(40px); opacity:0;} to { transform:none; opacity:1;} }
@keyframes overlayIn { from { opacity:0;} to {opacity:1;} }
.fade-up { animation: riseIn .5s cubic-bezier(.2,.7,.3,1); }

/* ===================== SHELL ===================== */
.app { min-height: 100vh; display: flex; background: var(--canvas); }

/* sidebar */
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0; position: sticky; top: 0; height: 100vh;
  background: var(--sidebar); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 22px 16px 16px; z-index: 40;
}
.sb-brand { display:flex; align-items:center; gap:11px; padding: 4px 8px 22px; cursor:pointer; }
.sb-mark {
  width:42px; height:42px; border-radius:13px; background: var(--brand-gradient);
  display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
  box-shadow: 0 6px 16px rgba(0,99,208,.30);
}
.sb-name { font-family: var(--font-display); font-weight:800; font-size:19px; letter-spacing:-.03em; color: var(--ink); line-height:1; }
.sb-tag { font-size:11px; color: var(--ink-3); font-weight:600; margin-top:3px; letter-spacing:.01em; }

.sb-section { font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-4); padding: 16px 12px 8px; }
.sb-nav { display:flex; flex-direction:column; gap:3px; }
.sb-link {
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  padding: 11px 13px; border-radius: 13px; font-size:14.5px; font-weight:600; color: var(--ink-2);
  transition: background .15s, color .15s; position:relative;
}
.sb-link:hover { background: var(--canvas); color: var(--ink); }
.sb-link.on { background: var(--brand-soft); color: var(--violet-ink); }
.sb-link.on .sb-ico { color: var(--violet); }
.sb-link.rise.on { background: var(--rise-soft); color: var(--rise-deep); }
.sb-link.rise.on .sb-ico { color: var(--rise); }
.sb-ico { color: var(--ink-4); display:inline-flex; }
.sb-badge { margin-left:auto; min-width:20px; height:20px; padding:0 6px; border-radius:999px; background: var(--accent); color:#fff; font-size:11.5px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; }
.sb-link.rise .sb-badge { background: var(--rise); }

.sb-spacer { flex: 1; }

/* role switch (bottom of sidebar) */
.role-switch { padding: 12px; background: var(--canvas); border-radius: 16px; margin-top: 12px; }
.role-switch .rs-label { font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color: var(--ink-3); margin: 2px 4px 9px; }
.role-seg { display:flex; flex-direction:column; gap:4px; }
.role-opt {
  display:flex; align-items:center; gap:10px; padding: 9px 11px; border-radius: 11px;
  font-size:13.5px; font-weight:600; color: var(--ink-2); transition: background .15s, color .15s, box-shadow .15s;
}
.role-opt:hover { background: var(--surface); }
.role-opt.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.role-opt.on .ro-ico { color: var(--violet); }
.ro-ico { color: var(--ink-4); display:inline-flex; }
.ro-dot { margin-left:auto; width:7px; height:7px; border-radius:50%; background: var(--violet); opacity:0; }
.role-opt.on .ro-dot { opacity:1; }

/* mobile topbar (hidden on desktop) */
.topbar { display:none; }
.mobile-tabbar { display:none; }

/* main column */
.main { flex: 1; min-width: 0; display:flex; flex-direction:column; }
.main-scroll { flex:1; min-width:0; }
.page { max-width: 1140px; margin: 0 auto; padding: 40px 44px 120px; }
.app.rise-on .page { }

/* ============ Responsive ============ */
@media (max-width: 1000px) {
  .app { flex-direction: column; }
  .sidebar { display: none; }
  .topbar {
    display:flex; align-items:center; gap:12px; position: sticky; top:0; z-index:50;
    background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line); padding: 11px 16px;
  }
  .tb-brand { display:flex; align-items:center; gap:9px; }
  .tb-mark { width:34px; height:34px; border-radius:11px; background:var(--brand-gradient); display:flex; align-items:center; justify-content:center; color:#fff; box-shadow:0 4px 12px rgba(0,99,208,.3); }
  .tb-name { font-family:var(--font-display); font-weight:800; font-size:17px; letter-spacing:-.03em; }
  .tb-spacer { flex:1; }
  .tb-role {
    display:inline-flex; align-items:center; gap:7px; padding:8px 13px; border-radius:999px;
    background: var(--canvas); font-size:13px; font-weight:700; color: var(--ink);
  }
  .tb-role .ro-ico { color: var(--violet); }
